name: WildRandom
main: com.minkang.wild.RandomWildPlugin
version: 1.3.3
api-version: 1.16
author: MinKang
commands:
  귓:
    description: /w 별칭(귓속말). EssentialsX 등 /w 제공 플러그인으로 전달합니다.
    usage: /귓 <플레이어> <내용>
    aliases:
    - 귓말
  야생랜덤리로드:
    description: WildRandom 설정 리로드
    usage: /야생랜덤리로드
    aliases:
    - wrreload
    - wildrandomreload
    - 랜덤리로드
permissions:
  wildrandom.reload:
    description: 플러그인 설정 리로드 권한
    default: op
  whisper.use:
    description: /귓 사용
    default: true
